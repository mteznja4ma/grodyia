syntax = "proto3";

package message;

option go_package = "../internal/message";

// 基本消息
message BaseMessage {
  string name = 1;  // 消息名称
  bytes  data = 2;  // 元数据
}

// 服务间信息传递
message Invocation {
  BaseMessage   meta = 1; // 元数据
}

// 服务间信息返回
message Return {
  uint32        code = 1; // 状态码
  string        info = 2; // 消息备注
  BaseMessage   meta = 3; // 元数据
}
